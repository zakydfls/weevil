name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-deploy.yml"
      - "apps/backend/**"
      - "deploy/backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH || 'weevil' }}
  API_BIND: ${{ vars.BACKEND_API_BIND || '127.0.0.1' }}
  API_PORT: ${{ vars.BACKEND_API_PORT || '4000' }}
  SSH_PORT: ${{ vars.BACKEND_SSH_PORT || '22' }}
  USE_CF_ACCESS: ${{ vars.BACKEND_SSH_USE_CF_ACCESS || 'false' }}
  RUN_PROD_SEED: ${{ vars.RUN_PROD_SEED }}

jobs:
  quality:
    name: Typecheck backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck backend
        run: pnpm --filter @weevil/backend typecheck

  image:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      image: ${{ steps.image.outputs.image }}
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/backend"
          image_tag="${image}:sha-${GITHUB_SHA}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_tag }}
            ${{ steps.image.outputs.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend to VPS
    runs-on: ubuntu-latest
    needs: image
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY GH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "$name secret is required" >&2
              exit 1
            fi
          done

          case "${USE_CF_ACCESS,,}" in
            true|1|yes|on)
              if [[ -z "$CF_ACCESS_CLIENT_ID" || -z "$CF_ACCESS_CLIENT_SECRET" ]]; then
                echo "CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET are required when BACKEND_SSH_USE_CF_ACCESS=true" >&2
                exit 1
              fi
              ;;
            false|0|no|off|"")
              ;;
            *)
              echo "BACKEND_SSH_USE_CF_ACCESS must be true or false" >&2
              exit 1
              ;;
          esac

          if [[ "$DEPLOY_PATH" == "~/"* || "$DEPLOY_PATH" == *" "* ]]; then
            echo "BACKEND_DEPLOY_PATH should be a relative path like 'weevil' or an absolute path without spaces" >&2
            exit 1
          fi

          if ! [[ "$SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "BACKEND_SSH_PORT must be a numeric port" >&2
            exit 1
          fi

      - name: Detect Cloudflare Access
        id: cloudflare
        shell: bash
        env:
          USE_CF_ACCESS: ${{ env.USE_CF_ACCESS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          case "${USE_CF_ACCESS,,}" in
            true|1|yes|on) use_cf=true ;;
            *) use_cf=false ;;
          esac

          if [[ "$use_cf" == "true" && -n "$CF_ACCESS_CLIENT_ID" && -n "$CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cloudflared
        if: ${{ steps.cloudflare.outputs.enabled == 'true' }}
        shell: bash
        run: |
          curl -fsSL -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ env.SSH_PORT }}
          USE_CF_ACCESS: ${{ env.USE_CF_ACCESS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/weevil_prod
          chmod 600 ~/.ssh/weevil_prod

          {
            echo "Host weevil-prod"
            echo "  HostName $SSH_HOST"
            echo "  Port $SSH_PORT"
            echo "  User $SSH_USER"
            echo "  IdentityFile ~/.ssh/weevil_prod"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            case "${USE_CF_ACCESS,,}" in
              true|1|yes|on) use_cf=true ;;
              *) use_cf=false ;;
            esac
            if [[ "$use_cf" == "true" ]]; then
              echo "  ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET"
            fi
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload deploy files
        shell: bash
        run: |
          ssh weevil-prod "mkdir -p ${DEPLOY_PATH}"
          scp deploy/backend/compose.prod.yml deploy/backend/deploy.sh weevil-prod:"${DEPLOY_PATH}/"
          ssh weevil-prod "chmod +x ${DEPLOY_PATH}/deploy.sh"

      - name: Deploy
        shell: bash
        env:
          WEEVIL_BACKEND_IMAGE: ${{ needs.image.outputs.image_tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          quote() {
            printf '%q' "$1"
          }

          ssh weevil-prod \
            "APP_DIR=$(quote "$DEPLOY_PATH") API_BIND=$(quote "$API_BIND") API_PORT=$(quote "$API_PORT") RUN_PROD_SEED=$(quote "$RUN_PROD_SEED") WEEVIL_BACKEND_IMAGE=$(quote "$WEEVIL_BACKEND_IMAGE") GHCR_USERNAME=$(quote "$GHCR_USERNAME") GH_TOKEN=$(quote "$GH_TOKEN") $(quote "${DEPLOY_PATH}/deploy.sh")"
